<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takaful Oman — API Admin</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css?v=mobile-nav">
    <link rel="stylesheet" href="admin.css?v=mobile-nav">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-cover">
            <div class="loader">
                <img src="images/loader.png" alt="Takaful Oman">
            </div>
        </div>
    </div>

    <div class="wave-bg" aria-hidden="true"></div>

    <div id="loginView" class="login-wrap hidden">
        <form class="login-card" id="loginForm">
            <img src="images/takaful-logo.png" alt="Takaful Oman" class="login-logo">
            <h1>Privileged access</h1>
            <p>Manage products, APIs, documentation, and the collection.</p>
            <label>Username<input type="text" id="loginUser" autocomplete="username" required></label>
            <label>Password<input type="password" id="loginPass" autocomplete="current-password" required></label>
            <p class="form-error" id="loginError"></p>
            <button class="primary-btn" type="submit">Sign in</button>
        </form>
    </div>

    <div id="adminApp" class="app hidden">
        <div class="shell" id="adminShell">
            <aside class="sidebar" id="adminSidebar">
                <div class="sidebar-top">
                    <button class="sidebar-toggle" id="sidebarToggle" type="button" title="Collapse sidebar" aria-label="Collapse sidebar" aria-expanded="true">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                            <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <a class="admin-brand" href="index.html" title="Open playground">
                        <img src="images/takaful-logo.png" alt="Takaful Oman" class="brand-logo">
                    </a>
                </div>
                <nav class="sidebar-nav" id="adminTree"></nav>
            </aside>
            <div class="admin-main">
                <header class="topbar">
                    <button class="icon-btn menu-toggle" id="menuToggle" type="button" aria-label="Open navigation" aria-expanded="false">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                            <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <nav class="admin-tabs" id="adminTabs">
                        <button class="tab-btn active" data-view="products" type="button">Products &amp; services</button>
                        <button class="tab-btn" data-view="collection" type="button">Collections</button>
                    </nav>
                    <div class="topbar-actions">
                        <button class="ghost-btn" id="adminEnvBtn" type="button" title="Environment variables">
                            Environment
                            <span class="env-dot" id="adminEnvDot"></span>
                        </button>
                        <button class="profile-btn" id="hostSettingsBtn" type="button" title="Host settings">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
                                <path d="M12 4.5v2.2M12 17.3v2.2M4.9 7.1l1.6 1.6M17.5 15.3l1.6 1.6M3.5 12h2.2M18.3 12h2.2M4.9 16.9l1.6-1.6M17.5 8.7l1.6-1.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                            </svg>
                        </button>
                        <div class="profile-wrap">
                            <button class="profile-btn" id="profileBtn" type="button" title="Account" aria-haspopup="true" aria-expanded="false">
                                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.7"/>
                                    <path d="M5.2 19c.9-3.4 3.6-5.2 6.8-5.2s5.9 1.8 6.8 5.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                                </svg>
                            </button>
                            <div class="profile-menu hidden" id="profileMenu">
                                <button type="button" id="changePasswordBtn">Change password</button>
                                <button type="button" id="logoutBtn">Sign out</button>
                            </div>
                        </div>
                    </div>
                </header>
                <main class="workspace" id="workspace"></main>
            </div>
            <div class="sidebar-backdrop" id="adminSidebarBackdrop"></div>
        </div>
    </div>

    <aside class="drawer" id="adminEnvDrawer" aria-hidden="true">
        <div class="drawer-panel">
            <div class="drawer-head drawer-head-close">
                <h2>Environment</h2>
                <button class="icon-btn" id="closeAdminEnvBtn" type="button" aria-label="Close environment">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M5 5l8 8M13 5l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                </button>
            </div>
            <div class="drawer-body" id="adminEnvBody"></div>
            <div class="drawer-foot">
                <button class="ghost-btn" id="addAdminEnvBtn" type="button">Add variable</button>
                <button class="primary-btn" id="saveAdminEnvBtn" type="button">Save environment</button>
            </div>
        </div>
    </aside>

    <aside class="drawer" id="hostSettingsDrawer" aria-hidden="true">
        <div class="drawer-panel">
            <div class="drawer-head">
                <div>
                    <h2>Host settings</h2>
                    <p>Main hosts show IP and latency on Overview. Related hosts appear as small name-and-status cards. You can add or remove either.</p>
                </div>
                <button class="icon-btn" id="closeHostSettingsBtn" type="button" aria-label="Close host settings">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M5 5l8 8M13 5l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                </button>
            </div>
            <div class="drawer-body" id="hostSettingsBody"></div>
            <div class="drawer-foot">
                <button class="ghost-btn" id="addHostBtn" type="button">Add host</button>
                <button class="ghost-btn" id="addRelatedHostBtn" type="button">Add related host</button>
                <button class="primary-btn" id="saveHostsBtn" type="button">Save hosts</button>
            </div>
        </div>
    </aside>

    <div class="tree-menu-portal hidden" id="treeMenuPortal">
        <button type="button" data-portal-rename>Rename</button>
        <button type="button" class="danger" data-portal-delete>Delete</button>
    </div>

    <div class="confirm-modal hidden" id="confirmModal">
        <div class="confirm-panel">
            <p id="confirmMessage"></p>
            <div class="toolbar">
                <button class="ghost-btn" id="confirmCancel" type="button">Cancel</button>
                <button class="primary-btn" id="confirmOk" type="button">Confirm</button>
            </div>
        </div>
    </div>

    <div class="confirm-modal hidden" id="passwordModal">
        <div class="confirm-panel password-panel">
            <h2>Change password</h2>
            <label>Current password<input id="currentPassword" type="password" autocomplete="current-password"></label>
            <label>New password<input id="newPassword" type="password" autocomplete="new-password"></label>
            <label>Confirm new password<input id="confirmPassword" type="password" autocomplete="new-password"></label>
            <p class="form-error" id="passwordError"></p>
            <div class="toolbar">
                <button class="ghost-btn" id="passwordCancel" type="button">Cancel</button>
                <button class="primary-btn" id="passwordSave" type="button">Save password</button>
            </div>
        </div>
    </div>

    <div class="env-var-pop hidden" id="envVarPopover">
        <div class="env-var-pop-row">
            <input id="envVarPopValue" type="text" autocomplete="off" aria-label="Environment value">
            <button class="primary-btn small" id="envVarPopSave" type="button">Save</button>
        </div>
    </div>

    <script src="handlebars.min.js"></script>
    <script src="json-viewer.js"></script>
    <script src="admin.js?v=mobile-nav"></script>
</body>
</html>
